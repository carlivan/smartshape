version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartshape-postgres
    environment:
      POSTGRES_DB: smartshape_db
      POSTGRES_USER: smartshape
      POSTGRES_PASSWORD: smartshape123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshape"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: smartwhape-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: